[project]
name = "multi-persona-chatbot"
version = "0.1.0"
description = "Multi-persona AI chat — pick a character, and it stays in character."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "clerk-backend-api>=6.0.1",
    "deepeval>=4.1.5",
    "fastapi>=0.140.13",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.9",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "portalocker[win32]>=4.1.0 ; sys_platform == 'win32'",
]
