<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a72b5"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <style>
      .gt   { font-size:15px; font-weight:700; fill:#2f2f2f; text-anchor:middle; }
      .gs   { font-size:10.5px; font-style:italic; fill:#666; text-anchor:middle; }
      .bl   { font-size:13.5px; font-weight:700; fill:#241a08; text-anchor:middle; }
      .bs   { font-size:10.5px; fill:#4a3a1c; text-anchor:middle; }
      .wl   { font-size:12.5px; font-weight:700; fill:#fff; text-anchor:middle; }
      .pl   { font-size:12.5px; font-weight:700; fill:#2b2038; text-anchor:middle; }
      .rl   { font-size:12px; font-weight:700; fill:#6a2020; text-anchor:middle; }
      .gl   { font-size:12px; font-weight:700; fill:#333; text-anchor:middle; }
      .el   { font-size:11px; fill:#333; text-anchor:middle; }
      .elr  { font-size:11px; fill:#c0392b; font-weight:600; text-anchor:middle; }
      .flow { stroke:#333; stroke-width:2.2; fill:none; marker-end:url(#arw); }
      .flow2{ stroke:#333; stroke-width:2.2; fill:none; marker-end:url(#arw); marker-start:url(#arw); }
      .red  { stroke:#c0392b; stroke-width:1.8; fill:none; stroke-dasharray:7 5; marker-end:url(#arwR); }
      .dotB { stroke:#5a72b5; stroke-width:1.8; fill:none; stroke-dasharray:2 4; marker-end:url(#arwB); }
      .dotR { stroke:#c0392b; stroke-width:1.8; fill:none; stroke-dasharray:2 4; marker-end:url(#arwR); }
      .dotG { stroke:#8a8a8a; stroke-width:1.8; fill:none; stroke-dasharray:2 4; marker-end:url(#arwG); }
    </style>
  </defs>

  <rect x="8" y="8" width="1184" height="844" rx="12" fill="#fbfaf7" stroke="#d9c9a3" stroke-width="3"/>
  <text x="500" y="52" font-size="27" font-weight="700" fill="#1d1d1d" text-anchor="middle">Multi-Persona Chatbot: Target Architecture</text>

  <!-- legend -->
  <rect x="944" y="26" width="228" height="66" rx="8" fill="#fff" stroke="#c9c9c9"/>
  <path d="M962,50 L1012,50" class="flow"/>
  <text x="1026" y="54" font-size="11" fill="#333" text-anchor="start">main flow</text>
  <path d="M962,74 L1012,74" class="dotG"/>
  <text x="1026" y="78" font-size="11" fill="#333" text-anchor="start">cross-cutting</text>

  <!-- ================= ROW 1 ================= -->
  <rect x="30" y="132" width="150" height="62" rx="9" fill="#cfe3cd" stroke="#7fa87c" stroke-width="2"/>
  <text x="105" y="158" class="bl" fill="#1e3a1c">Browser</text>
  <text x="105" y="176" class="bs" fill="#365234">Jinja2 + vanilla JS</text>

  <path d="M182,163 L228,163" class="flow"/>
  <text x="205" y="154" class="el">HTTP</text>

  <rect x="236" y="112" width="320" height="102" rx="12" fill="#eef0ee" stroke="#a8b0a8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="396" y="132" class="gt">FastAPI (uvicorn)</text>
  <rect x="248" y="142" width="145" height="56" rx="7" fill="#e9a63f" stroke="#b97d1c" stroke-width="2"/>
  <text x="320.5" y="166" class="bl">api/v1 routes</text>
  <text x="320.5" y="183" class="bs">thin — no SQL</text>
  <rect x="404" y="142" width="140" height="56" rx="7" fill="#e9a63f" stroke="#b97d1c" stroke-width="2"/>
  <text x="474" y="166" class="bl">get_current_user</text>
  <text x="474" y="183" class="bs">deps.py</text>

  <path d="M558,168 L596,168" class="flow"/>
  <rect x="600" y="140" width="150" height="58" rx="8" fill="#e9a63f" stroke="#b97d1c" stroke-width="2"/>
  <text x="675" y="164" class="bl">Pydantic schemas</text>
  <text x="675" y="182" class="bs">validate in / out</text>

  <path d="M675,200 L675,248" class="flow"/>
  <text x="742" y="228" class="el">MessageCreate</text>

  <!-- ================= ROW 2: ChatService ================= -->
  <rect x="300" y="252" width="470" height="104" rx="12" fill="#f6ecd2" stroke="#c3ac72" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="535" y="276" class="gt">ChatService  (services/)</text>
  <rect x="314" y="288" width="145" height="52" rx="7" fill="#e9a63f" stroke="#b97d1c" stroke-width="2"/>
  <text x="386.5" y="310" class="bl">Load history</text>
  <text x="386.5" y="327" class="bs">last 20 messages</text>
  <rect x="470" y="288" width="120" height="52" rx="7" fill="#e9a63f" stroke="#b97d1c" stroke-width="2"/>
  <text x="530" y="310" class="bl">Run agent</text>
  <text x="530" y="327" class="bs">await ainvoke</text>
  <rect x="602" y="288" width="155" height="52" rx="7" fill="#e9a63f" stroke="#b97d1c" stroke-width="2"/>
  <text x="679.5" y="310" class="bl">Save reply</text>
  <text x="679.5" y="327" class="bs">+ touch updated_at</text>

  <!-- SSE back to browser -->
  <path d="M298,322 L105,322 L105,200" class="red"/>
  <text x="200" y="312" class="elr">SSE: token / done</text>

  <!-- ChatService -> Postgres -->
  <path d="M772,300 L940,300" class="flow2"/>
  <text x="856" y="291" class="el">SQL</text>

  <!-- into llm -->
  <path d="M350,358 L350,456" class="flow"/>
  <text x="358" y="378" class="el" text-anchor="start">rows + persona</text>
  <!-- out of llm -->
  <path d="M712,450 L712,360" class="flow"/>
  <text x="722" y="378" class="el" text-anchor="start">reply</text>
  <text x="726" y="438" class="el" text-anchor="start">yes</text>

  <!-- ================= ROW 3: llm/ ================= -->
  <rect x="150" y="392" width="740" height="195" rx="12" fill="#f7edd4" stroke="#c8b98f" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="520" y="416" class="gt">llm/ — LangChain objects stay inside</text>

  <ellipse cx="205" cy="490" rx="38" ry="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="205" y="495" font-size="12" font-weight="700" fill="#222" text-anchor="middle">START</text>
  <path d="M245,490 L264,490" class="flow"/>

  <rect x="268" y="460" width="160" height="60" rx="8" fill="#e9a63f" stroke="#b97d1c" stroke-width="2"/>
  <text x="348" y="484" class="bl">to_langchain()</text>
  <text x="348" y="501" class="bs">SystemMessage(persona)</text>
  <text x="348" y="514" class="bs">+ last 20 rows</text>

  <path d="M430,490 L456,490" class="flow"/>
  <rect x="460" y="460" width="150" height="60" rx="8" fill="#e9a63f" stroke="#b97d1c" stroke-width="2"/>
  <text x="535" y="484" class="bl">agent.ainvoke()</text>
  <text x="535" y="501" class="bs">ReAct agent, tools=[]</text>
  <text x="535" y="514" class="bs">compiled once at startup</text>

  <path d="M612,490 L640,490" class="flow"/>
  <path d="M712,450 L780,490 L712,530 L644,490 Z" fill="#f0c14b" stroke="#b8901c" stroke-width="2"/>
  <text x="712" y="494" font-size="12.5" font-weight="700" fill="#241a08" text-anchor="middle">reply ok?</text>

  <path d="M712,532 L712,558 L535,558 L535,524" class="red"/>
  <text x="800" y="552" class="elr">no: retry ×1,</text>
  <text x="800" y="566" class="elr">then 502</text>

  <path d="M892,490 L940,490" class="flow2"/>
  <text x="916" y="480" font-size="9.5" fill="#333" text-anchor="middle">prompt ⇄ reply</text>

  <!-- ================= RIGHT: Postgres ================= -->
  <rect x="944" y="160" width="186" height="200" rx="12" fill="#f0eaf6" stroke="#a98fc4" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1037" y="184" class="gt">Postgres</text>
  <text x="1037" y="200" class="gs">repositories/ own all SQL</text>
  <rect x="960" y="212" width="154" height="28" rx="6" fill="#c4a6dd" stroke="#8a63b0" stroke-width="2"/>
  <text x="1037" y="231" class="pl">users</text>
  <rect x="960" y="246" width="154" height="28" rx="6" fill="#c4a6dd" stroke="#8a63b0" stroke-width="2"/>
  <text x="1037" y="265" class="pl">personas</text>
  <rect x="960" y="280" width="154" height="28" rx="6" fill="#c4a6dd" stroke="#8a63b0" stroke-width="2"/>
  <text x="1037" y="299" class="pl">conversations</text>
  <rect x="960" y="314" width="154" height="28" rx="6" fill="#c4a6dd" stroke="#8a63b0" stroke-width="2"/>
  <text x="1037" y="333" class="pl">messages</text>
  <text x="1037" y="376" class="gs">source of truth — not a LangGraph checkpointer</text>

  <!-- ================= RIGHT: Groq ================= -->
  <rect x="944" y="420" width="186" height="136" rx="12" fill="#eef0ee" stroke="#a0a8a0" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1037" y="446" class="gt">Groq API</text>
  <rect x="960" y="458" width="154" height="34" rx="7" fill="#e9a63f" stroke="#b97d1c" stroke-width="2"/>
  <text x="1037" y="479" font-size="11.5" font-weight="700" fill="#241a08" text-anchor="middle">openai/gpt-oss-120b</text>
  <rect x="960" y="502" width="154" height="34" rx="7" fill="#e9a63f" stroke="#b97d1c" stroke-width="2"/>
  <text x="1037" y="523" font-size="11.5" font-weight="700" fill="#241a08" text-anchor="middle">temp 0.7 · 1024 max</text>
  <text x="1037" y="574" class="gs">streaming enabled in phase 7</text>

  <!-- ================= BOTTOM: cross-cutting ================= -->
  <path d="M200,648 L200,591" class="dotB"/>
  <path d="M590,648 L590,591" class="dotR"/>
  <path d="M1152,648 L1152,364" class="dotG"/>

  <rect x="30" y="650" width="340" height="140" rx="12" fill="#e3e9f7" stroke="#8095c8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="200" y="676" class="gt">⚙ Config / Settings</text>
  <rect x="46" y="690" width="308" height="38" rx="7" fill="#4d63a8" stroke="#33477f" stroke-width="2"/>
  <text x="200" y="714" class="wl">.env → Settings (Pydantic)</text>
  <rect x="46" y="738" width="308" height="38" rx="7" fill="#4d63a8" stroke="#33477f" stroke-width="2"/>
  <text x="200" y="762" class="wl">GROQ_API_KEY · model · limits</text>

  <rect x="400" y="650" width="380" height="140" rx="12" fill="#f7e3e3" stroke="#c89090" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="590" y="676" class="gt">🛡 Guardrails (phase 8)</text>
  <rect x="416" y="690" width="176" height="38" rx="7" fill="#f0c9c9" stroke="#c07f7f" stroke-width="2"/>
  <text x="504" y="714" class="rl">Rate limit 30/hr</text>
  <rect x="600" y="690" width="164" height="38" rx="7" fill="#f0c9c9" stroke="#c07f7f" stroke-width="2"/>
  <text x="682" y="714" class="rl">60s timeout + retry</text>
  <rect x="416" y="738" width="348" height="38" rx="7" fill="#f0c9c9" stroke="#c07f7f" stroke-width="2"/>
  <text x="590" y="762" class="rl">FakeAgent + ChatService tests</text>

  <rect x="810" y="650" width="360" height="140" rx="12" fill="#eeeeee" stroke="#aaaaaa" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="990" y="676" class="gt">🔐 Auth (phase 9)</text>
  <rect x="826" y="690" width="328" height="38" rx="7" fill="#dcdcdc" stroke="#999" stroke-width="2"/>
  <text x="990" y="714" class="gl">Google OAuth → upsert user</text>
  <rect x="826" y="738" width="328" height="38" rx="7" fill="#dcdcdc" stroke="#999" stroke-width="2"/>
  <text x="990" y="762" class="gl">httpOnly session cookie</text>

  <text x="600" y="820" font-size="11.5" font-style="italic" fill="#777" text-anchor="middle">Built today: phases 0–2 (FastAPI · Groq agent · in-memory history). Everything else is the planned target — see docs/07-build-plan.md</text>
</svg>
